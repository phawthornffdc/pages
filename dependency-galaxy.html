<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="org-analyser explore">
<title>Certinia Galaxy</title>
<style>
/* A deliberately dark "night sky" page. Top bar with title, path and search; a large canvas you zoom into
   (products > our objects > our fields > their components); a guide panel beside it (below on phones).
   No web fonts and nothing fetched: the file has to open offline, anywhere. */
:root {
    color-scheme: dark;
    --space: #070b14;
    --panel: #0f1624;
    --panel-2: #152034;
    --ink: #e8eef7;
    --ink-2: #a9b6c9;
    --ink-3: #74839a;
    --rule: #22304a;
    --glow: #7fb2ff;
    --flag-upgrade: #fab219;
    --flag-critical: #ff6b6b;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-head: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--space); color: var(--ink); }
body { font: 14px/1.5 var(--font-body); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.wrap {
    max-width: 1440px; margin: 0 auto; padding-block: 18px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px;
}
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
h1 { font: 600 1.45rem var(--font-head); margin: 0; letter-spacing: 0.01em; }
.sub { color: var(--ink-2); margin: 2px 0 0; font-size: 0.86rem; max-width: 75ch; }
.search { position: relative; width: min(380px, 100%); }
.search input {
    width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule);
    background: var(--panel); color: var(--ink); font: 0.88rem var(--font-body);
}
.search input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5; background: var(--panel-2);
    border: 1px solid var(--rule); border-radius: 8px; max-height: 340px; overflow-y: auto; padding: 4px;
}
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.84rem; min-height: 28px; }
.crumbs button { color: var(--ink-2); font-family: var(--font-mono); font-size: 0.8rem; }
.crumbs button:first-child { font-family: var(--font-body); font-size: 0.84rem; }
.crumbs button:last-child { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--ink-3); }
.types { display: flex; flex-wrap: wrap; gap: 6px; }
.type {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink); font: 500 0.8rem var(--font-body); cursor: pointer;
}
.type i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.type[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
.type[aria-pressed="false"] i { opacity: 0.25; }
.type b { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.type.key { cursor: default; border-style: dashed; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.sky { position: relative; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; min-width: 0; background: var(--space); }
canvas { display: block; width: 100%; touch-action: manipulation; cursor: pointer; }
/* The wordmark's lowercase letters fill only the bottom 69% of its box (y 14.2-45.9 of 46); the rest is the
   t and the dots on the i's. GALAXY and its divider line up with those letters, not with the whole box. */
.badge {
    --logo-h: 20px;
    position: absolute; top: 12px; left: 12px; z-index: 2; pointer-events: none;
    display: flex; align-items: flex-end; gap: 10px; padding: 7px 12px 7px 10px; border-radius: 8px;
    background: rgba(7, 11, 20, 0.62); color: var(--ink);
}
.badge .logo { height: var(--logo-h); width: auto; display: block; }
.badge span {
    --body-h: calc(var(--logo-h) * 0.69);
    font: 300 0.82rem var(--font-body); letter-spacing: 0.32em; text-transform: uppercase; color: var(--glow);
    height: var(--body-h); line-height: var(--body-h); padding-left: 10px;
    border-left: 1px solid rgba(127, 178, 255, 0.35);
}
@media (max-width: 480px) { .badge { --logo-h: 15px; } .badge span { font-size: 0.68rem; } }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 0.76rem; color: var(--ink-3); pointer-events: none; }
.tip {
    position: absolute; pointer-events: none; background: rgba(15, 22, 36, 0.95); border: 1px solid var(--rule);
    color: var(--ink); padding: 6px 9px; border-radius: 6px; font-size: 0.78rem; max-width: 280px; z-index: 3;
}
.tip .m { font-family: var(--font-mono); font-size: 0.74rem; overflow-wrap: anywhere; }
.tip .d { color: var(--ink-2); }
.panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; min-width: 0;
    display: flex; flex-direction: column; gap: 14px; max-height: 78vh; overflow-y: auto;
}
.kind { font-size: 0.7rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.panel h2 { font: 600 1.05rem var(--font-head); margin: 2px 0 0; overflow-wrap: anywhere; }
.panel h2.mono { font: 400 0.95rem var(--font-mono); }
.panel p { margin: 0; color: var(--ink-2); font-size: 0.84rem; }
.panel h3 { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat b { display: block; font: 600 1.25rem var(--font-head); font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.72rem; color: var(--ink-3); }
.mix { display: flex; height: 8px; gap: 2px; border-radius: 4px; overflow: hidden; }
.mixkey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 0.76rem; color: var(--ink-2); }
.mixkey i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.list { display: flex; flex-direction: column; gap: 2px; }
.row {
    display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center;
    padding: 5px 6px; border-radius: 6px; font-size: 0.8rem; color: var(--ink); text-align: left; width: 100%;
}
.row:hover, .row:focus-visible { background: var(--panel-2); outline: none; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 0.75rem; }
.row .nm.plain { font-family: var(--font-body); font-size: 0.8rem; }
.row .ct { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 0.76rem; white-space: nowrap; }
.row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tag { font-size: 0.66rem; padding: 0 5px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-2); margin-left: 4px; font-family: var(--font-body); }
.tag.w { border-color: var(--glow); color: var(--glow); }
.flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flags li { font-size: 0.8rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; color: var(--ink-2); overflow-wrap: anywhere; }
.chip { font-size: 0.66rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; color: #160d00; }
.chip.upgrade { background: var(--flag-upgrade); }
.chip.deprecation, .chip.support { background: var(--flag-critical); color: #200; }
.chip.overlap { background: var(--glow); }
.grp { font-size: 0.72rem; color: var(--ink-3); margin: 8px 0 2px 6px; font-family: var(--font-mono); overflow-wrap: anywhere; }
.note { border-left: 2px solid var(--rule); padding-left: 10px; }
button { font: inherit; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
.crumbs button:focus-visible, .type:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; border-radius: 4px; }
.foot { color: var(--ink-3); font-size: 0.76rem; max-width: 110ch; margin: 0; }
</style>
</head>

            if (dx * dx + dy * dy <= Math.max(r, d.depth === 4 ? 4 : r) ** 2) best = d;
        }
        return best;
    }
    function pt(ev) { const b = canvas.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; }
    canvas.addEventListener('click', ev => {
        const [x, y] = pt(ev); const d = hit(x, y);
        if (!d || !d.ancestors().includes(focus)) { if (focus.parent) zoomTo(focus.parent); return; }
        if (d === focus) return;
        if (d.depth === 4) { selectComp(d.data.comp); if (d.parent !== focus) zoomTo(d.parent); return; }
        zoomTo(d.ancestors().find(a => a.parent === focus));
    });
    canvas.addEventListener('mousemove', ev => {
        const [x, y] = pt(ev); const d = hit(x, y);
        if (d !== hover) { hover = d; draw(); }
        if (!d) { tip.hidden = true; return; }
        let html;
        if (d.depth === 4) {
            const c = comps[d.data.comp];
            html = '<div class="m">' + esc(c[1]) + '</div><div class="d">' + MODEL.kinds[c[0]] + ' · ' + (d.data.w ? 'writes ' : 'reads ') + esc(d.parent.data.name) + (STATUS[c[3]] ? ' · ' + STATUS[c[3]] : '') + '</div>';
        } else {
            html = '<div class="' + (d.depth === 1 ? '' : 'm') + '">' + esc(d.data.name) + '</div><div class="d">' + LEVEL[d.depth] + ' · ' + fmt(d.set.size) + ' of their components depend on it</div>';
        }
        tip.innerHTML = html; tip.hidden = false;
        let tx = x + 14; if (tx + 290 > sky.clientWidth) tx = x - 294;
        tip.style.left = Math.max(4, tx) + 'px'; tip.style.top = (y + 14) + 'px';
    });
    canvas.addEventListener('mouseleave', () => { tip.hidden = true; hover = null; draw(); });
    document.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape' || document.activeElement === document.getElementById('q')) return;
        if (selectedComp !== null) { selectComp(null); return; }
        if (focus.parent) zoomTo(focus.parent);
    });

    // ---------- chrome ----------
    function renderTypes() {
        const counts = MODEL.kinds.map(() => 0);
        comps.forEach(c => counts[c[0]]++);
        document.getElementById('types').innerHTML = MODEL.kinds.map((t, i) => counts[i]
            ? '<button class="type" type="button" data-i="' + i + '" aria-pressed="' + enabled[i] + '"><i style="background:' + KIND_COLOURS[i] + '"></i>' + t + ' <b>' + fmt(counts[i]) + '</b></button>' : '').join('')
            + '<span class="type key"><i style="background:transparent;box-shadow:inset 0 0 0 2px #fff"></i>white ring: writes to our data</span>'
            + '<span class="type key"><i style="background:#9aa6b8;opacity:.4"></i>faded: inactive or test only</span>'
            + (MODEL.findings.upgradeImpact
                ? '<span class="type key"><i style="background:transparent;border:1.5px dashed #ff6b6b"></i>red dashed: deprecated or out of support</span>'
                + '<span class="type key"><i style="background:transparent;border:1.5px dashed #fab219"></i>orange dashed: new rules, automation or changed fields in ' + esc(MODEL.findings.upgradeImpact.target) + '</span>'
                : '');
        document.querySelectorAll('.type[data-i]').forEach(b => b.addEventListener('click', () => {
            const i = +b.dataset.i;
            if (enabled.filter(Boolean).length === 1 && enabled[i]) return;
            enabled[i] = !enabled[i]; rebuild(focus.key);
        }));
    }
    function crumbs() {
        const path = focus.ancestors().reverse();
        const el = document.getElementById('crumbs');
        el.innerHTML = path.map((d, i) => '<button type="button" data-i="' + i + '">' + esc(d.depth === 0 ? 'All products' : d.data.name) + '</button>').join('<span class="sep">›</span>');
        el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => zoomTo(path[+b.dataset.i])));
    }
    function typeMix(set) {
        const c = MODEL.kinds.map(() => 0); set.forEach(x => c[comps[x][0]]++);
        return '<div class="mix">' + c.map((v, i) => v ? '<div style="flex:' + v + ';background:' + KIND_COLOURS[i] + '" title="' + MODEL.kinds[i] + ': ' + v + '"></div>' : '').join('') + '</div>'
            + '<div class="mixkey">' + c.map((v, i) => v ? '<span><i style="background:' + KIND_COLOURS[i] + '"></i>' + MODEL.kinds[i] + ' ' + fmt(v) + '</span>' : '').join('') + '</div>';
    }
    function rowsFor(children, plain) {
        return '<div class="list">' + children.map(c => '<button class="row" type="button" data-k="' + esc(c.key) + '"><i style="background:' + ringColour(c.data.flags) + '"></i><span class="nm' + (plain ? ' plain' : '') + '">' + esc(c.data.name) + '</span><span class="ct">' + fmt(c.set.size) + '</span></button>').join('') + '</div>';
    }
    // The list dot beside a row matches its ring on the map.
    function ringColour(flags) {
        if (flags && flags.some(f => f.kind === 'deprecation' || f.kind === 'support')) return '#ff6b6b';
        if (flags && flags.some(f => f.kind === 'upgrade')) return '#fab219';
        return 'rgba(127,178,255,0.5)';
    }
    function flagList(flags, heading) {
        if (!flags || !flags.length) return '';
        return '<div><h3>' + heading + '</h3><ul class="flags">' + flags.map(f => '<li><span class="chip ' + f.kind + '">' + FLAG[f.kind] + '</span><span>' + esc(f.text) + '</span></li>').join('') + '</ul></div>';
    }
    function tags(c, w) {
        return (w ? '<span class="tag w">writes</span>' : '<span class="tag">reads</span>') + (STATUS[c[3]] ? '<span class="tag">' + STATUS[c[3]] + '</span>' : '');
    }
    function bindRows(el) {
        el.querySelectorAll('.row[data-k]').forEach(b => b.addEventListener('click', () => {
            const d = root.descendants().find(n => n.key === b.dataset.k); if (d) { selectComp(null); zoomTo(d); }
        }));
        el.querySelectorAll('.row[data-c]').forEach(b => b.addEventListener('click', () => selectComp(+b.dataset.c)));
    }
    function findingsNote() {
        const f = MODEL.findings; const missing = [];
        if (!f.upgradeImpact) missing.push('<code>upgrade-impact</code> (what the target release changes)');
        if (!f.automationOverlap) missing.push('<code>automation-overlap</code> (Certinia automation in the same save)');
        return missing.length ? '<p class="note">Not run on this extract, so not shown: ' + missing.join(' and ') + '.</p>' : '';
    }
    function panel() {
        const el = document.getElementById('panel');
        if (selectedComp !== null) { compPanel(el); return; }
        const d = focus;
        let html = '<div><div class="kind">' + LEVEL[d.depth] + '</div><h2 class="' + (d.depth >= 2 ? 'mono' : '') + '">' + esc(d.depth === 0 ? 'All Certinia products in this org' : d.data.name) + '</h2></div>';
        const leaves = d.leaves();
        const fieldsUsed = new Set(leaves.map(l => l.parent.key)).size;
        const writers = new Set(leaves.filter(l => l.data.w).map(l => l.data.comp)).size;
        html += '<div class="stats"><div class="stat"><b>' + fmt(d.set.size) + '</b><span>of their components depend on this</span></div>'
            + '<div class="stat"><b>' + fmt(writers) + '</b><span>of those write to it</span></div>'
            + '<div class="stat"><b>' + fmt(d.depth < 3 ? fieldsUsed : d.children.length) + '</b><span>' + (d.depth < 3 ? 'of our fields and classes used' : 'dependencies') + '</span></div></div>';
        html += '<div><h3>What kinds of component</h3>' + typeMix(d.set) + '</div>';
        if (d.depth === 2 || d.depth === 3) html += flagList(d.data.flags, d.depth === 2 ? 'From Certinia\'s source' : 'From Certinia\'s source, on this field');
        if (d.depth === 0) html += '<div><h3>Products · click to fly in</h3>' + rowsFor(d.children, true) + '</div>';
        if (d.depth === 1) html += '<div><h3>Our objects they depend on most</h3>' + rowsFor(d.children.slice(0, 60)) + '</div>';
        if (d.depth === 2) html += '<div><h3>Our fields they use</h3>' + rowsFor(d.children.slice(0, 80)) + '</div>';
        if (d.depth === 3) {
            const byKind = [...groupBy(d.children, c => comps[c.data.comp][0])].sort((a, b) => a[0] - b[0]);
            html += '<div><h3>Their components that depend on it</h3>' + byKind.map(([t, list]) => '<div class="grp">' + MODEL.kinds[t] + ' (' + list.length + ')</div><div class="list">'
                + list.map(c => { const cc = comps[c.data.comp]; return '<button class="row" type="button" data-c="' + c.data.comp + '"><i style="background:' + KIND_COLOURS[cc[0]] + '"></i><span class="nm">' + esc(cc[1]) + '</span><span class="ct">' + tags(cc, c.data.w) + '</span></button>'; }).join('') + '</div>').join('') + '</div>';
        }
        if (d.depth === 0) {
            html += '<p>Products are the large clouds, our objects the circles inside, our fields inside those, and every coloured dot is one of the customer\'s components. A dashed ring marks something the target release changes: orange for new rules, automation or changed fields, red for deprecation or end of support. Select a ringed circle to see why.</p>';
            html += findingsNote();
        }
        el.innerHTML = html; bindRows(el);
    }
    function compPanel(el) {
        const c = comps[selectedComp];
        const uses = root.leaves().filter(l => l.data.comp === selectedComp);
        const byObj = groupBy(uses, l => l.parent.parent.data.name);
        el.innerHTML = '<div><div class="kind">Their component · ' + MODEL.kinds[c[0]] + ' (' + esc(c[2]) + ')</div><h2 class="mono">' + esc(c[1]) + '</h2></div>'
            + '<p>' + (c[3] === 'active' ? 'Active.' : c[3] === 'inactive' ? 'Inactive: it does not run.' : c[3] === 'test' ? 'A test class: it runs in tests, not in production.' : 'Whether it runs is not known.') + ' Every place it depends on us is lit up on the map.</p>'
            + '<div class="stats"><div class="stat"><b>' + fmt(uses.length) + '</b><span>of our components it depends on</span></div>'
            + '<div class="stat"><b>' + fmt(byObj.size) + '</b><span>of our objects</span></div>'
            + '<div class="stat"><b>' + fmt(uses.filter(u => u.data.w).length) + '</b><span>it writes to</span></div></div>'
            + '<div><h3>What it depends on</h3>' + [...byObj].map(([o, list]) => '<div class="grp">' + esc(o) + '</div><div class="list">'
                + list.map(l => '<button class="row" type="button" data-k="' + esc(l.parent.key) + '"><i style="background:' + KIND_COLOURS[c[0]] + '"></i><span class="nm">' + esc(l.parent.data.name) + '</span><span class="ct">' + (l.data.w ? '<span class="tag w">writes</span>' : '<span class="tag">reads</span>') + '</span></button>').join('') + '</div>').join('') + '</div>'
            + '<button class="row" type="button" id="clear" style="grid-template-columns:1fr;color:var(--glow)">Clear selection (Esc)</button>';
        bindRows(el);
        el.querySelector('#clear').addEventListener('click', () => selectComp(null));
    }
    function selectComp(i) { selectedComp = i; panel(); draw(); }

    // ---------- search ----------
    const q = document.getElementById('q'), res = document.getElementById('results');
    q.addEventListener('input', () => {
        const s = q.value.trim().toLowerCase();
        if (s.length < 2) { res.hidden = true; return; }
        const ours = root.descendants().filter(d => (d.depth === 2 || d.depth === 3) && d.data.name.toLowerCase().includes(s)).slice(0, 10);
        const theirs = []; const seen = new Set();
        for (const l of root.leaves()) {
            const c = comps[l.data.comp];
            if (!seen.has(l.data.comp) && c[1].toLowerCase().includes(s)) { seen.add(l.data.comp); theirs.push(l.data.comp); if (theirs.length >= 10) break; }
        }
        res.innerHTML = ours.map(d => '<button class="row" type="button" data-k="' + esc(d.key) + '"><i style="background:rgba(127,178,255,0.6)"></i><span class="nm">' + esc(d.depth === 3 ? d.parent.data.name + '.' + d.data.name : d.data.name) + '</span><span class="ct">ours</span></button>').join('')
            + theirs.map(i => '<button class="row" type="button" data-c="' + i + '"><i style="background:' + KIND_COLOURS[comps[i][0]] + '"></i><span class="nm">' + esc(comps[i][1]) + '</span><span class="ct">theirs</span></button>').join('')
            || '<p style="padding:8px;margin:0;color:var(--ink-3);font-size:0.8rem">Nothing matches.</p>';
        res.hidden = false;
        res.querySelectorAll('.row[data-k]').forEach(b => b.addEventListener('click', () => {
            const d = root.descendants().find(n => n.key === b.dataset.k); res.hidden = true; q.value = ''; selectComp(null); zoomTo(d);
        }));
        res.querySelectorAll('.row[data-c]').forEach(b => b.addEventListener('click', () => {
            res.hidden = true; q.value = ''; const i = +b.dataset.c;
            const first = root.leaves().find(l => l.data.comp === i); selectComp(i); if (first) zoomTo(first.parent.parent);
        }));
    });
    document.addEventListener('click', ev => { if (!ev.target.closest('.search')) res.hidden = true; });

    // ---------- text ----------
    const n = MODEL.counts;
    document.getElementById('title').textContent = 'Certinia Galaxy · ' + META.org;
    document.title = 'Certinia Galaxy · ' + META.org;
    document.getElementById('sub').textContent = fmt(n.components) + ' of the customer\'s components depend on ' + fmt(n.objects)
        + ' of Certinia\'s objects across ' + n.products + ' products. Fly into a product, then an object, then a field, to see whose work rests on it.'
        + (MODEL.findings.upgradeImpact ? ' Target release: ' + MODEL.findings.upgradeImpact.target + '.' : '');
    document.getElementById('foot').textContent = 'Written by org-analyser ' + META.toolVersion + ' on ' + META.generatedAt.slice(0, 10)
        + ' from the org\'s extract. Every coloured dot is one customer component depending on one Certinia object, field or global class, read from the customer\'s validation rules, fields, Flows, Apex, workflow, approval processes, Visualforce and Lightning. '
        + 'A component that uses five of our fields appears five times; select it to see all five lit up. Permission sets, profiles and layouts are not included, and Apex that builds field names at run time can be missed. '
        + 'Flags on our objects come from Certinia\'s product source at the installed and target versions.';

    // ---------- links in: #object=<api name> zooms to that object (the report links here) ----------
    function fromHash() {
        const m = /^#object=(.+)$/.exec(location.hash);
        if (!m) return;
        let name; try { name = decodeURIComponent(m[1]); } catch { return; }
        const d = root.descendants().find(n => n.depth === 2 && n.data.name === name);
        if (d) { selectComp(null); zoomTo(d); }
    }
    window.addEventListener('hashchange', fromHash);

    window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(resize, 120); });
    rebuild(null); resize(); fromHash();
})();
</script>
</body>
</html>
